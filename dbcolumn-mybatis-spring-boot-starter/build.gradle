plugins {
    id 'java-library'
}

description = 'dbcolumn-mybatis-core를 Spring Boot 애플리케이션에 자동으로 ' +
        '연결해주는 스타터입니다. 이 의존성만 추가하면 ' +
        '애플리케이션 쪽에 별도의 @Configuration 없이 @DbColumn 매핑이 동작합니다.'

ext {
    springBootVersion = '4.1.1'
    mybatisSpringBootVersion = '4.1.0'
}

dependencies {
    api project(':dbcolumn-mybatis-core')

    // 이 스타터 하나만 추가해도 MyBatis Spring Boot 연동까지 함께 딸려오도록 api로 노출
    api "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringBootVersion}"

    implementation "org.springframework.boot:spring-boot-autoconfigure:${springBootVersion}"
}
