plugins {
    id 'java-library'
}

description = '@DbColumn 애노테이션과 MyBatis ObjectWrapperFactory 구현체. ' +
        'Spring에 의존하지 않는 순수 MyBatis 확장 라이브러리입니다.'

dependencies {
    // 공개 API(DbColumnObjectWrapperFactory, DbColumnBeanWrapper)가 MyBatis 타입을
    // 그대로 노출하므로 compileOnly가 아닌 api로 선언해 소비자에게 전이시킵니다.
    api 'org.mybatis:mybatis:3.5.19'
}
