spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=DB2;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  sql:
    init:
      mode: always

mybatis:
  mapper-locations:
    - classpath:/mapper/**/*.xml

  configuration:
    map-underscore-to-camel-case: true
