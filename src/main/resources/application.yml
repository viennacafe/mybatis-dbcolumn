spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

mybatis:
  mapper-locations:
    - classpath:/mapper/**/*.xml

  configuration:
    map-underscore-to-camel-case: true
